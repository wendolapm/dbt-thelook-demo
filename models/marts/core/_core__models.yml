version: 2

models:
  - name: dim_users
    description: User dimension built from staged user data.
    columns:
      - name: user_id
        description: Primary key for the user dimension.
        data_tests:
          - not_null
          - unique

      - name: traffic_source
        description: Original traffic source associated with the user.

      - name: country
        description: User country.

  - name: dim_products
    description: Product dimension built from staged product data.
    columns:
      - name: product_id
        description: Primary key for the product dimension.
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: Name of the product.

      - name: category
        description: Product category.

      - name: retail_price
        description: Retail price of the product.

  - name: fct_order_items
    description: Fact table at the order-item grain, enriched with order, user, and product attributes.
    columns:
      - name: order_item_id
        description: Primary key for the fact table.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Order identifier.
        data_tests:
          - not_null

      - name: user_id
        description: User identifier.
        data_tests:
          - not_null

      - name: product_id
        description: Product identifier.
        data_tests:
          - not_null

      - name: sale_price
        description: Sale price captured on the order item.

      - name: order_created_at
        description: Timestamp when the order was created.

      - name: order_status
        description: Current order status from the orders table.